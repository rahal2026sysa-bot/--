<title>شيخ الكار</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: one dark-forest world. Customer = single phone column; admin = side rail (desktop) / bottom bar (phone). Stamps live on an ivory strip so the black aqal reads. */
:root{
  --bg:#0A1913; --surface:#0F241C; --surface-2:#143128; --raise:#18392E;
  --emerald:#1D5B44; --emerald-deep:#0E3A2B;
  --gold:#BFA46A; --gold-soft:#D5C394; --gold-line:rgba(191,164,106,.22); --gold-line-2:rgba(191,164,106,.4);
  --ivory:#F2ECDD; --ivory-2:#E7DFCB; --ink:#0B0D0C;
  --text:#EEE9DC; --muted:#A3B1A7; --faint:#6F8378;
  --ok:#7CC49A; --warn:#E0B061; --bad:#E08273;
  --f-display:"Aref Ruqaa","Amiri","Traditional Arabic",serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI","Tahoma",sans-serif;
  --r:14px; --r-sm:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* demo bar */
.demo{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:#06110D;border-bottom:1px solid var(--gold-line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.demo .seg{display:inline-flex;background:var(--surface);border:1px solid var(--gold-line);border-radius:999px;padding:3px}
.demo .seg button{border:0;background:none;padding:5px 14px;border-radius:999px;color:var(--muted);font-weight:500}
.demo .seg button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.demo .note{flex:1;min-width:200px}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--r-sm);padding:10px 16px;font-weight:600;font-size:14.5px;transition:background .15s,transform .1s,border-color .15s;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:var(--gold);color:var(--ink)}
.btn-primary:hover:not([disabled]){background:var(--gold-soft)}
.btn-green{background:var(--emerald);color:var(--ivory);border-color:rgba(242,236,221,.12)}
.btn-green:hover:not([disabled]){background:#23694F}
.btn-ghost{background:transparent;border-color:var(--gold-line-2);color:var(--text)}
.btn-ghost:hover:not([disabled]){background:var(--surface-2)}
.btn-danger{background:transparent;border-color:rgba(224,130,115,.5);color:var(--bad)}
.btn-lg{padding:14px 20px;font-size:16px;border-radius:12px}
.btn-sm{padding:6px 11px;font-size:13px}
.btn svg{width:18px;height:18px}
.field{display:grid;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.input,select.input,textarea.input{width:100%;background:var(--bg);border:1px solid var(--gold-line-2);border-radius:var(--r-sm);padding:10px 12px;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--gold)}
textarea.input{min-height:76px;resize:vertical}
.hint{font-size:12.5px;color:var(--faint)}
.err{font-size:13px;color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--gold-line-2);color:var(--gold-soft);white-space:nowrap}
.chip.ok{border-color:rgba(124,196,154,.45);color:var(--ok)}
.chip.warn{border-color:rgba(224,176,97,.5);color:var(--warn)}
.chip.bad{border-color:rgba(224,130,115,.5);color:var(--bad)}
.chip.mute{color:var(--faint);border-color:rgba(163,177,167,.25)}

/* aqal stamp */
.aqal{display:block;width:100%;height:auto;color:var(--ink);--braid:rgba(242,236,221,.28)}
.aqal.off{color:rgba(14,58,43,.2);--braid:transparent}
.aqal.gold{color:var(--gold);--braid:rgba(11,13,12,.25)}
@keyframes pop{0%{transform:scale(.4) rotate(-12deg);opacity:0}60%{transform:scale(1.15)}100%{transform:none;opacity:1}}
.cell.pop .aqal{animation:pop .55s cubic-bezier(.2,.9,.3,1.3)}

/* emblem / wordmark */
.emblem{display:block}
.word{font-family:var(--f-display);font-weight:700;color:var(--ivory);line-height:1.1}
.word small{display:block;font-family:var(--f-body);font-weight:500;font-size:.32em;letter-spacing:.06em;color:var(--gold);margin-top:.35em}

/* PASS (wallet card) */
.pass{position:relative;width:100%;max-width:360px;margin-inline:auto;background:#0E2F23;color:var(--ivory);border-radius:16px;overflow:hidden;
  box-shadow:0 18px 40px -18px rgba(0,0,0,.7),0 0 0 1px rgba(191,164,106,.25) inset}
.pass::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.07;
  background:repeating-linear-gradient(135deg,var(--gold) 0 1px,transparent 1px 7px)}
.pass>*{position:relative}
.pass-head{display:flex;align-items:center;gap:10px;padding:14px 16px 12px}
.pass-head .lt{font-family:var(--f-display);font-size:20px;font-weight:700;flex:1;line-height:1.2}
.pass-head .hf{text-align:left;line-height:1.15}
.pass-head .hf small,.pf small{display:block;font-size:10.5px;letter-spacing:.05em;color:var(--gold);font-weight:500}
.pass-head .hf b{font-size:20px;font-weight:600}
.strip{background:var(--ivory);padding:14px 14px 12px;position:relative}
.aqals{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:6px 8px;max-width:calc(var(--cols) * 60px);margin-inline:auto}
.cell{aspect-ratio:1/1;display:grid;place-items:center;max-width:100%}
.ribbon{margin-top:10px;background:var(--ink);color:var(--gold-soft);border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600;text-align:center}
.strip .togo{margin-top:8px;text-align:center;font-size:12.5px;color:#41594E;font-weight:500}
.pf-row{display:flex;gap:12px;padding:12px 16px 0}
.pf{flex:1;min-width:0}
.pf b{display:block;font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.pf.sm b{font-size:13px;font-weight:500}
.qrbox{margin:14px auto 16px;background:var(--ivory);border-radius:10px;padding:10px 10px 6px;width:max-content;text-align:center;color:var(--ink)}
.qrbox small{display:block;font-size:11px;letter-spacing:.08em;margin-top:2px}
.qr img,.qr canvas{display:block;max-width:100%;height:auto}
.qr-fallback{font-size:11px;word-break:break-all;max-width:140px}
/* google variant */
.pass.google{border-radius:26px;background:#0F2E22}
.pass.google .g-top{display:flex;align-items:center;gap:10px;padding:16px 18px 6px;font-size:13px;color:var(--muted)}
.pass.google .g-title{padding:0 18px;font-family:var(--f-display);font-size:23px;font-weight:700}
.pass.google .g-bal{padding:4px 18px 14px;display:flex;gap:22px}
.pass.google .g-bal b{display:block;font-size:22px;font-weight:600}
.pass.google .g-bal small{font-size:11px;color:var(--gold)}
.pass.google .strip{margin:0 14px;border-radius:14px}
.pass.paused::after{content:"البرنامج متوقف مؤقتاً";position:absolute;top:12px;left:-34px;transform:rotate(-35deg);background:var(--warn);color:var(--ink);font-size:11px;font-weight:700;padding:3px 40px}
.back{max-width:360px;margin:10px auto 0;background:var(--surface);border:1px solid var(--gold-line);border-radius:var(--r);padding:6px 16px}
.back dl{margin:0;display:grid}
.back div{padding:10px 0;border-bottom:1px solid var(--gold-line)}
.back div:last-child{border:0}
.back dt{font-size:11.5px;color:var(--gold);letter-spacing:.04em}
.back dd{margin:0;font-size:14px;overflow-wrap:anywhere}
.back a{color:var(--gold-soft)}

/* CUSTOMER */
.cust{min-height:calc(100% - 46px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px;
  background:radial-gradient(120% 60% at 50% 0%,#123B2D 0%,var(--bg) 70%)}
.col{max-width:420px;margin-inline:auto;display:grid;gap:18px}
.join-hero{text-align:center;display:grid;justify-items:center;gap:10px;padding-top:10px}
.join-hero .word{font-size:46px}
.welcome{color:var(--muted);text-align:center;margin:0;text-wrap:balance}
.offer{display:flex;align-items:center;gap:12px;border:1px solid var(--gold-line-2);border-radius:var(--r);padding:12px 14px;background:rgba(14,58,43,.4)}
.offer .mini{width:44px;flex:none;background:var(--ivory);border-radius:10px;padding:5px}
.offer b{display:block;color:var(--ivory)}
.offer span{font-size:13px;color:var(--muted)}
.phone-in{font-size:20px;letter-spacing:.06em;text-align:left;padding:14px 16px}
.fine{font-size:12.5px;color:var(--faint);text-align:center;margin:0}
.hello{text-align:center}
.hello h1{font-family:var(--f-display);font-size:28px;margin:0;font-weight:700}
.hello p{margin:2px 0 0;color:var(--muted);font-size:14px}
.congrats{border:1px solid var(--gold);background:linear-gradient(0deg,rgba(191,164,106,.12),rgba(191,164,106,.12)),var(--surface);border-radius:var(--r);padding:14px 16px;text-align:center}
.congrats b{display:block;font-family:var(--f-display);font-size:22px;color:var(--gold-soft)}
.wallet-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wbtn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:11px 8px;font-weight:600;font-size:13.5px;border:1px solid rgba(242,236,221,.2);background:#000;color:#fff}
.wbtn.g{background:#1f1f1f}
.wbtn svg{width:20px;height:20px}
.infobox{background:var(--surface);border:1px solid var(--gold-line);border-radius:var(--r);padding:14px 16px;font-size:13.5px;color:var(--muted)}
.infobox b{color:var(--text)}
.infobox ul{margin:6px 0 0;padding-inline-start:18px}
.seg2{display:inline-flex;border:1px solid var(--gold-line-2);border-radius:999px;padding:3px;background:var(--bg)}
.seg2 button{border:0;background:none;padding:4px 12px;border-radius:999px;font-size:12.5px;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--surface-2);color:var(--gold-soft)}
.center{text-align:center}
.linkbtn{background:none;border:0;color:var(--gold-soft);text-decoration:underline;text-underline-offset:3px;padding:4px}

/* ADMIN */
.admin{display:grid;grid-template-columns:1fr;min-height:calc(100% - 46px)}
.side{display:none}
.main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.topbar h1{margin:0;font-size:22px;font-weight:700;flex:1;text-wrap:balance}
.actor{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--emerald);display:grid;place-items:center;color:var(--ivory);font-weight:700;font-size:13px;border:1px solid var(--gold-line-2)}
.bottom{position:fixed;inset:auto 0 0;z-index:20;background:rgba(6,17,13,.96);backdrop-filter:blur(8px);border-top:1px solid var(--gold-line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-i{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:9px 2px 8px;color:var(--faint);font-size:11.5px;font-weight:500;position:relative}
.nav-i svg{width:23px;height:23px}
.nav-i[aria-current="page"]{color:var(--gold-soft)}
.nav-i[aria-current="page"]::before{content:"";position:absolute;top:0;width:28px;height:2px;border-radius:2px;background:var(--gold)}
.nav-i .dot{position:absolute;top:6px;margin-inline-start:22px;min-width:16px;height:16px;border-radius:8px;background:var(--gold);color:var(--ink);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
@media (min-width:900px){
  .admin{grid-template-columns:248px 1fr}
  .side{display:flex;flex-direction:column;gap:6px;background:#081610;border-inline-start:0;border-inline-end:1px solid var(--gold-line);padding:22px 14px;position:sticky;top:46px;height:calc(100vh - 46px)}
  .side .brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;margin-bottom:6px;border-bottom:1px solid var(--gold-line)}
  .side .brand .word{font-size:24px}
  .side .nav-i{flex-direction:row;gap:12px;padding:11px 12px;border-radius:10px;font-size:14.5px;justify-content:flex-start}
  .side .nav-i[aria-current="page"]{background:var(--surface-2)}
  .side .nav-i[aria-current="page"]::before{top:10px;bottom:10px;right:0;width:2px;height:auto}
  .side .nav-i .dot{position:static;margin-inline-start:auto}
  .side .foot{margin-top:auto;font-size:12px;color:var(--faint);padding:8px}
  .bottom{display:none}
  .main{padding-block:26px 40px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
}
.panel{background:var(--surface);border:1px solid var(--gold-line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-size:15px;margin:0 0 12px;font-weight:600;display:flex;align-items:center;gap:8px}
.panel h2 .chip{margin-inline-start:auto}
.grid{display:grid;gap:14px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1150px){.stats{grid-template-columns:repeat(5,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--gold-line);border-radius:var(--r);padding:14px;display:grid;gap:2px}
.stat.hero{background:var(--emerald-deep);border-color:var(--gold-line-2)}
.stat small{font-size:12.5px;color:var(--muted)}
.stat b{font-size:28px;font-weight:600;line-height:1.2;color:var(--ivory)}
.stat.hero b{color:var(--gold-soft)}
.stat span{font-size:12px;color:var(--faint)}
.two{display:grid;gap:14px}
@media (min-width:1000px){.two{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}}
.list{display:grid}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--gold-line);min-width:0}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--faint)}
.row-btn{width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--gold-line);padding:12px 4px;display:flex;align-items:center;gap:12px;border-radius:0}
.row-btn:hover{background:var(--surface-2)}
.ico{width:34px;height:34px;flex:none;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--gold)}
.ico svg{width:18px;height:18px}
.ico.mini-aqal{background:var(--ivory);padding:4px}
.prog{display:flex;gap:3px;direction:rtl}
.prog i{width:10px;height:5px;border-radius:2px;background:rgba(242,236,221,.14)}
.prog i.on{background:var(--gold)}
.empty{padding:24px 8px;text-align:center;color:var(--faint);font-size:14px}
.searchbar{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--gold-line-2);border-radius:12px;padding:4px 4px 4px 12px}
.searchbar:focus-within{border-color:var(--gold)}
.searchbar input{flex:1;min-width:0;background:none;border:0;outline:none;padding:9px 10px}
.searchbar svg{width:18px;height:18px;color:var(--faint);margin-inline-start:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.tabs button{border:1px solid var(--gold-line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 14px;font-size:13.5px;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:600}
.detail{display:grid;gap:14px}
@media (min-width:1000px){.detail{grid-template-columns:380px minmax(0,1fr);align-items:start}.detail .sticky{position:sticky;top:70px}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--faint)}
.kv dd{margin:0;overflow-wrap:anywhere}
.bigstamp{width:100%;padding:16px;font-size:17px;border-radius:12px}
.inline-confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface-2);border:1px solid var(--gold-line-2);border-radius:10px;padding:10px 12px}
.inline-confirm p{margin:0;flex:1;min-width:160px;font-size:13.5px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:start;font-weight:500;color:var(--faint);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--gold-line-2);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--gold-line);vertical-align:top}
tr:last-child td{border-bottom:0}
.form{display:grid;gap:14px}
.form .cols{display:grid;gap:14px}
@media (min-width:640px){.form .cols{grid-template-columns:1fr 1fr}}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--gold-line-2);background:var(--bg);font-size:20px}
.stepper input{width:76px;text-align:center;font-size:20px;font-weight:600}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.presets button{border:1px solid var(--gold-line-2);background:var(--bg);color:var(--text);border-radius:999px;padding:7px 14px;font-size:13.5px}
.presets button[aria-pressed="true"]{background:var(--emerald);border-color:var(--gold);color:var(--ivory)}
.radio{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--gold-line);border-radius:10px;padding:10px 12px;cursor:pointer}
.radio:has(input:checked){border-color:var(--gold);background:var(--surface-2)}
.radio input{margin-top:5px;accent-color:var(--gold)}
.radio b{display:block;font-weight:600;font-size:14px}
.radio span{font-size:12.5px;color:var(--muted)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}
.status-pill{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.status-pill::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.poster{background:var(--emerald-deep);border:1px solid var(--gold-line-2);border-radius:18px;padding:24px 20px;text-align:center;display:grid;justify-items:center;gap:12px;max-width:340px;margin-inline:auto}
.poster .word{font-size:34px}
.poster p{margin:0;color:var(--muted)}
.poster .qrbox{margin:4px auto}
.coord{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mapcard{border:1px dashed var(--gold-line-2);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center;background:
  repeating-linear-gradient(0deg,transparent 0 23px,rgba(191,164,106,.07) 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,rgba(191,164,106,.07) 23px 24px),var(--bg)}
.mapcard svg{width:34px;height:34px;color:var(--gold);flex:none}
.login{max-width:440px;margin:40px auto;display:grid;gap:16px}
.login .word{font-size:40px;text-align:center}
.toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ivory);color:var(--ink);border-radius:12px;padding:11px 16px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px);display:flex;gap:10px;align-items:center}
.toast.bad{background:#F3D6CF;color:#5A1A10}
@media (min-width:900px){.toast{bottom:28px}}
@keyframes up{from{transform:translate(-50%,12px);opacity:0}}
.toast{animation:up .2s ease-out}

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
/*ENGINE-START*/
const DAY = 864e5;
const ROLES = {
  admin:   { label:'المدير', perms:['view','stamp','adjust','redeem','settings','staff'] },
  staff:   { label:'موظف', perms:['view','stamp'] },
  rewards: { label:'موظف المكافآت', perms:['view','redeem'] }
};
const REWARD_PRESETS = [
  { key:'tailor', title:'تفصيل عقال مجاني', free:true },
  { key:'aqal', title:'عقال مجاني', free:true },
  { key:'pct20', title:'خصم 20%', free:false },
  { key:'sar30', title:'خصم 30 ريالاً', free:false },
  { key:'product', title:'منتج مجاني', free:true },
  { key:'custom', title:'', free:false }
];
const ORD = ['','الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر','الثاني عشر','الثالث عشر','الرابع عشر','الخامس عشر','السادس عشر','السابع عشر','الثامن عشر','التاسع عشر','العشرون','الحادي والعشرون','الثاني والعشرون','الثالث والعشرون','الرابع والعشرون','الخامس والعشرون','السادس والعشرون','السابع والعشرون','الثامن والعشرون','التاسع والعشرون','الثلاثون','الحادي والثلاثون'];
const MAX_STAMPS = 30;

let S = null;
const Store = {
  key:'sheikh-alkar-proto-v1',
  load(){ try { const raw = localStorage.getItem(this.key); return raw ? JSON.parse(raw) : null; } catch(e){ return null; } },
  save(){ try { localStorage.setItem(this.key, JSON.stringify(S)); } catch(e){} }
};

function uid(p){ return p + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3); }
function token(n=16){ const a='abcdefghjkmnpqrstuvwxyz23456789'; let s=''; const r=(typeof crypto!=='undefined'&&crypto.getRandomValues)?crypto.getRandomValues(new Uint8Array(n)):Array.from({length:n},()=>Math.random()*256|0); for(const x of r) s+=a[x%a.length]; return s; }
function toLatin(s){ return String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); }
function normalizePhone(raw){
  let s = toLatin(raw).replace(/[\s\-().]/g,'');
  if (s.startsWith('00')) s = '+' + s.slice(2);
  if (/^05\d{8}$/.test(s)) return '+966' + s.slice(1);
  if (/^5\d{8}$/.test(s)) return '+966' + s;
  if (/^9665\d{8}$/.test(s)) return '+' + s;
  if (/^\+9665\d{8}$/.test(s)) return s;
  if (/^\+(?!966)[1-9]\d{7,14}$/.test(s)) return s;
  return null;
}
function phoneLocal(e164){ if (e164.startsWith('+966')) { const l='0'+e164.slice(4); return l.slice(0,3)+' '+l.slice(3,6)+' '+l.slice(6); } return e164; }
function phoneMasked(e164){ return '•••• ' + e164.slice(-4); }
function stampsWord(n){ if(n===1) return 'ختم واحد'; if(n===2) return 'ختمان'; if(n>=3&&n<=10) return n+' أختام'; return n+' ختماً'; }
function programLine(p){
  const preset = REWARD_PRESETS.find(x=>x.key===p.rewardType);
  if (preset && preset.free && ORD[p.stampsRequired+1]) return `${stampsWord(p.stampsRequired)} و${ORD[p.stampsRequired+1]} مجاني`;
  return `بعد ${stampsWord(p.stampsRequired)}: ${p.rewardTitle}`;
}

function emp(id){ return S.employees.find(e=>e.id===id); }
function can(actor, perm){ return !!actor && actor.active && ROLES[actor.role] && ROLES[actor.role].perms.includes(perm); }
function cust(id){ return S.customers.find(c=>c.id===id); }
function fail(msg, code){ return { ok:false, error:msg, code }; }
function audit(actorId, action, target, details, at){ S.audit.unshift({ id:uid('au'), at: at||Date.now(), actor: actorId, action, target, details: details||'' }); if (S.audit.length>800) S.audit.length=800; }
function remember(idem, res){ if(!idem) return res; S.idem[idem]=res; const k=Object.keys(S.idem); if(k.length>300) delete S.idem[k[0]]; return res; }

function sweep(at=Date.now()){
  for (const r of S.rewards) if (r.status==='earned' && r.expiresAt && r.expiresAt < at) { r.status='expired'; r.expiredAt=at; audit('system','انتهاء صلاحية مكافأة', r.custId, r.title, at); }
  for (const cy of S.cycles) if (cy.status==='active' && S.program.stampExpiryDays>0 && cy.stamps>0 && cy.lastStampAt && at - cy.lastStampAt > S.program.stampExpiryDays*DAY) {
    cy.status='expired'; cy.closedAt=at;
    S.txns.unshift({ id:uid('tx'), custId:cy.custId, type:'expire', before:cy.stamps, after:0, req:cy.req, cycleNo:cy.no, by:'system', at, reason:`لم يُضف ختم خلال ${S.program.stampExpiryDays} يوماً` });
    audit('system','انتهاء صلاحية أختام', cy.custId, `الدورة ${cy.no}: ${cy.stamps} أختام`, at);
    startCycle(cust(cy.custId), at, 0);
  }
}
function activeCycle(c){ return S.cycles.find(x=>x.custId===c.id && x.status==='active') || null; }
function displayCycle(c){ return activeCycle(c) || [...S.cycles].filter(x=>x.custId===c.id).sort((a,b)=>b.no-a.no)[0]; }
function pendingRewards(c){ return S.rewards.filter(r=>r.custId===c.id && r.status==='earned'); }
function startCycle(c, at, carry){
  const no = S.cycles.filter(x=>x.custId===c.id).length + 1;
  const cy = { id:uid('cy'), custId:c.id, no, req:S.program.stampsRequired, reward:S.program.rewardTitle, programV:S.program.version, stamps:0, status:'active', startedAt:at, lastStampAt:null };
  S.cycles.push(cy);
  if (carry>0) { cy.stamps = Math.min(carry, cy.req); if (cy.stamps>=cy.req) completeCycle(c, cy, at, 'system'); }
  return cy;
}
function completeCycle(c, cy, at, actorId){
  const excess = Math.max(0, cy.stamps - cy.req);
  cy.stamps = cy.req; cy.status='completed'; cy.completedAt=at;
  const r = { id:uid('rw'), custId:c.id, cycleId:cy.id, cycleNo:cy.no, title:cy.reward, terms:S.program.terms, status:'earned', earnedAt:at, expiresAt: S.program.rewardExpiryDays>0 ? at + S.program.rewardExpiryDays*DAY : null };
  S.rewards.push(r);
  audit(actorId,'استحقاق مكافأة', c.id, `${r.title} (الدورة ${cy.no})`, at);
  if (S.program.newCyclePolicy==='immediate') startCycle(c, at, excess); else cy.carry = excess;
  return r;
}
function bumpWallet(c, at){ c.walletV=(c.walletV||1)+1; c.walletAt=at; }

function register(rawPhone, at=Date.now()){
  const phone = normalizePhone(rawPhone);
  if (!phone) return fail('اكتب رقم جوال صحيحاً، مثل 05XXXXXXXX','bad_phone');
  const existing = S.customers.find(c=>c.phone===phone);
  if (existing) return { ok:true, existing:true, customer:existing };
  const c = { id:uid('cu'), phone, cardNo:'SK-' + (S.seq++), qr:token(18), status:'active', createdAt:at, walletV:1, walletAt:at, lastStampAt:null };
  S.customers.push(c); startCycle(c, at, 0);
  audit('customer','تسجيل عميل وإصدار بطاقة', c.id, c.cardNo, at);
  return { ok:true, existing:false, customer:c };
}

function addStamp(custId, actorId, opt={}){
  const at = opt.at || Date.now();
  if (opt.idem && S.idem[opt.idem]) return { ...S.idem[opt.idem], replay:true };
  const actor = emp(actorId);
  if (!can(actor,'stamp')) return fail('ليست لديك صلاحية إضافة الأختام','forbidden');
  if (!S.program.active) return fail('برنامج الولاء متوقف مؤقتاً. أعد تفعيله من الإعدادات لإضافة الأختام.','paused');
  const c = cust(custId); if (!c) return fail('العميل غير موجود','not_found');
  if (c.status!=='active') return fail('هذه البطاقة موقوفة','card_inactive');
  sweep(at);
  if (!opt.seed && S.program.cooldownSec>0 && c.lastStampAt && at - c.lastStampAt < S.program.cooldownSec*1000) {
    const left = Math.ceil((S.program.cooldownSec*1000 - (at - c.lastStampAt))/1000);
    return fail(`أُضيف ختم لهذا العميل قبل لحظات. لمنع التكرار انتظر ${left} ثانية، أو استخدم «تصحيح الرصيد» إن كان ختماً إضافياً مقصوداً.`,'cooldown');
  }
  let cy = activeCycle(c);
  if (!cy) {
    if (pendingRewards(c).length && S.program.newCyclePolicy==='on_redeem') return fail('لدى العميل مكافأة لم تُسلَّم بعد. سلّم المكافأة أولاً لتبدأ دورة الأختام الجديدة.','reward_pending');
    const last = displayCycle(c); cy = startCycle(c, at, last && last.carry || 0); if (last) last.carry = 0;
  }
  const before = cy.stamps; cy.stamps++; cy.lastStampAt = at; c.lastStampAt = at;
  const tx = { id:uid('tx'), custId:c.id, type:'stamp', before, after:cy.stamps, req:cy.req, cycleNo:cy.no, by:actorId, at };
  S.txns.unshift(tx);
  audit(actorId,'إضافة ختم', c.id, `${before} ← ${cy.stamps} من ${cy.req}`, at);
  let reward = null;
  if (cy.stamps >= cy.req) reward = completeCycle(c, cy, at, actorId);
  bumpWallet(c, at);
  return remember(opt.idem, { ok:true, tx, reward, cycle:cy });
}

function adjust(custId, actorId, delta, reason, opt={}){
  const at = opt.at || Date.now();
  if (opt.idem && S.idem[opt.idem]) return { ...S.idem[opt.idem], replay:true };
  const actor = emp(actorId);
  if (!can(actor,'adjust')) return fail('تصحيح الرصيد متاح للمدير فقط','forbidden');
  reason = String(reason||'').trim();
  if (reason.length < 3) return fail('اكتب سبب التصحيح (3 أحرف على الأقل)','reason');
  delta = parseInt(delta,10); if (!delta) return fail('اختر عدد الأختام للتصحيح','delta');
  const c = cust(custId); if (!c) return fail('العميل غير موجود');
  sweep(at);
  let cy = activeCycle(c);
  if (!cy) {
    if (pendingRewards(c).length && S.program.newCyclePolicy==='on_redeem') return fail('سلّم المكافأة المستحقة أولاً قبل تعديل الدورة الجديدة.','reward_pending');
    cy = startCycle(c, at, 0);
  }
  const before = cy.stamps, after = Math.max(0, Math.min(before + delta, cy.req));
  if (after === before) return fail(delta<0 ? 'لا توجد أختام لحذفها في الدورة الحالية' : 'الدورة مكتملة بالفعل','noop');
  cy.stamps = after;
  const tx = { id:uid('tx'), custId:c.id, type:'adjust', before, after, req:cy.req, cycleNo:cy.no, by:actorId, at, reason };
  S.txns.unshift(tx);
  audit(actorId,'تصحيح رصيد', c.id, `${before} ← ${after} — ${reason}`, at);
  let reward=null; if (after >= cy.req) reward = completeCycle(c, cy, at, actorId);
  bumpWallet(c, at);
  return remember(opt.idem, { ok:true, tx, reward });
}

function redeem(rewardId, actorId, opt={}){
  const at = opt.at || Date.now();
  if (opt.idem && S.idem[opt.idem]) return { ...S.idem[opt.idem], replay:true };
  const actor = emp(actorId);
  if (!can(actor,'redeem')) return fail('ليست لديك صلاحية اعتماد تسليم المكافآت','forbidden');
  sweep(at);
  const r = S.rewards.find(x=>x.id===rewardId); if (!r) return fail('المكافأة غير موجودة');
  if (r.status==='redeemed') { const who=emp(r.redeemedBy); return fail(`سُلّمت هذه المكافأة سابقاً${who?' بواسطة '+who.name:''}. لا يمكن تسليمها مرتين.`,'already'); }
  if (r.status==='expired') return fail('انتهت صلاحية هذه المكافأة','expired');
  r.status='redeemed'; r.redeemedAt=at; r.redeemedBy=actorId;
  const c = cust(r.custId);
  S.txns.unshift({ id:uid('tx'), custId:c.id, type:'redeem', before:null, after:null, cycleNo:r.cycleNo, by:actorId, at, reason:r.title });
  audit(actorId,'تسليم مكافأة', c.id, r.title, at);
  if (!activeCycle(c) && S.program.newCyclePolicy==='on_redeem') { const last = displayCycle(c); startCycle(c, at, last && last.carry || 0); if (last) last.carry=0; }
  bumpWallet(c, at);
  return remember(opt.idem, { ok:true, reward:r });
}

function validateProgram(d){
  const n = parseInt(d.stampsRequired,10);
  if (!(n>=1 && n<=MAX_STAMPS)) return `عدد الأختام يجب أن يكون بين 1 و${MAX_STAMPS}`;
  if (!String(d.rewardTitle||'').trim()) return 'اكتب اسم المكافأة';
  if (String(d.rewardTitle).length>60) return 'اسم المكافأة طويل؛ اجعله 60 حرفاً أو أقل';
  for (const k of ['stampExpiryDays','rewardExpiryDays']) { const v=parseInt(d[k],10); if (!(v>=0 && v<=3650)) return 'مدة الصلاحية بين 0 و3650 يوماً (0 = بلا انتهاء)'; }
  const cd=parseInt(d.cooldownSec,10); if (!(cd>=0 && cd<=3600)) return 'مدة منع التكرار بين 0 و3600 ثانية';
  return null;
}
function updateProgram(draft, carry, actorId, confirmText, at=Date.now()){
  const actor = emp(actorId);
  if (!can(actor,'settings')) return fail('الإعدادات متاحة للمدير فقط','forbidden');
  const e = validateProgram(draft); if (e) return fail(e,'invalid');
  const old = S.program;
  const n = parseInt(draft.stampsRequired,10), title = String(draft.rewardTitle).trim();
  const core = n!==old.stampsRequired || title!==old.rewardTitle;
  if (core && carry==='reset' && String(confirmText||'').trim()!=='تصفير') return fail('لتصفير أختام العملاء اكتب كلمة «تصفير» للتأكيد','confirm');
  S.programHistory.unshift({ ...old, until:at, changedBy:actorId });
  S.program = { ...old, stampsRequired:n, rewardType:draft.rewardType, rewardTitle:title, terms:String(draft.terms||'').trim(),
    stampExpiryDays:parseInt(draft.stampExpiryDays,10), rewardExpiryDays:parseInt(draft.rewardExpiryDays,10),
    cooldownSec:parseInt(draft.cooldownSec,10), newCyclePolicy:draft.newCyclePolicy==='on_redeem'?'on_redeem':'immediate', version:old.version+1 };
  let affected = 0, completed = 0;
  if (core) {
    for (const cy of S.cycles.filter(x=>x.status==='active')) {
      const c = cust(cy.custId);
      if (carry==='adopt') {
        cy.req = n; cy.reward = title; cy.programV = S.program.version; affected++;
        if (cy.stamps >= cy.req) { completeCycle(c, cy, at, actorId); completed++; }
        bumpWallet(c, at);
      } else if (carry==='reset') {
        if (cy.stamps>0) S.txns.unshift({ id:uid('tx'), custId:c.id, type:'reset', before:cy.stamps, after:0, req:cy.req, cycleNo:cy.no, by:actorId, at, reason:'تغيير برنامج الولاء مع تصفير الأختام' });
        cy.status='reset'; cy.closedAt=at; startCycle(c, at, 0); affected++; bumpWallet(c, at);
      }
    }
  }
  audit(actorId,'تعديل برنامج الولاء', 'program', `الإصدار ${S.program.version}: ${programLine(S.program)}${core?` — العملاء الحاليون: ${({adopt:'تحويل للبرنامج الجديد مع الإبقاء على أختامهم',keep:'إكمال دوراتهم على البرنامج السابق',reset:'تصفير'})[carry]}`:''}`, at);
  return { ok:true, affected, completed, core };
}
function setProgramActive(on, actorId){
  if (!can(emp(actorId),'settings')) return fail('الإعدادات متاحة للمدير فقط');
  S.program.active = !!on; audit(actorId, on?'إعادة تفعيل البرنامج':'إيقاف البرنامج مؤقتاً','program','');
  return { ok:true };
}
function resolveScan(text){
  const t = toLatin(String(text||'')).trim(); if (!t) return null;
  const m = t.match(/\/c\/([a-z0-9]+)/i); const tok = m ? m[1] : t;
  let c = S.customers.find(x=>x.qr===tok); if (c) return c;
  c = S.customers.find(x=>x.cardNo.toLowerCase()===t.toLowerCase().replace(/\s/g,'')); if (c) return c;
  const p = normalizePhone(t); if (p) return S.customers.find(x=>x.phone===p) || null;
  return null;
}
function searchCustomers(q){
  const t = toLatin(q).trim().toLowerCase().replace(/\s/g,'');
  if (!t) return [...S.customers].sort((a,b)=>(b.lastStampAt||b.createdAt)-(a.lastStampAt||a.createdAt));
  const digits = t.replace(/\D/g,'');
  return S.customers.filter(c=>{
    if (c.cardNo.toLowerCase().includes(t)) return true;
    if (digits.length>=3) { const loc = phoneLocal(c.phone).replace(/\D/g,''); return c.phone.includes(digits) || loc.includes(digits); }
    return false;
  });
}

    v:1, seq:10021, idem:{}, customers:[], cycles:[], rewards:[], txns:[], audit:[], programHistory:[],
    shop:{ name:'شيخ الكار لتفصيل العقال', phone:'0500000000', whatsapp:'0500000000', address:'عنوان تجريبي — عدّله من الإعدادات', city:'',
      mapsUrl:'', lat:24.7136, lng:46.6753, hours:'السبت – الخميس: 9:30 ص – 12:30 م، 4:30 م – 11 م\nالجمعة: 4:30 م – 11 م', website:'', baseUrl:'https://sheikh-alkar.example' },
    program:{ version:1, stampsRequired:5, rewardType:'tailor', rewardTitle:'تفصيل عقال مجاني', terms:'تُسلَّم المكافأة في المحل عند زيارتك التالية بعد اكتمال الأختام.',

      { id:'e3', name:'سالم', login:'salem@sheikh-alkar', role:'rewards', active:true }
    ]
  };
}
function seedDemo(){
  S = freshState();
  const t = Date.now(); let rnd = 7;
  const rand = ()=>{ rnd = (rnd*16807)%2147483647; return rnd/2147483647; };
  const plan = [9,7,5,4,3,2,1,6,0];
  plan.forEach((n,i)=>{
    const regAt = t - (24 - i*1.6)*DAY - rand()*DAY*0.5;
    const c = register('05000001' + String(10+i), regAt).customer;
    c.demo = true;
    let at = regAt + 2*3600e3;
    const span = (t - 3*3600e3 - at) / Math.max(n,1);
    for (let k=0;k<n;k++){ at += span*(0.6+rand()*0.6); if (at > t-600e3) at = t - 600e3 - (n-k)*60e3; addStamp(c.id, rand()>.35?'e2':'e1', { at, seed:true }); }
  });
  const byPlan = (i)=>S.customers[i];

function fillQR(){
  document.querySelectorAll('[data-qr]').forEach(el=>{
    const text = el.dataset.qr, size = +el.dataset.size || 128;
    if (window.QRCode) { try { new QRCode(el,{ text, width:size, height:size, colorDark:'#0B0D0C', colorLight:'#F2ECDD', correctLevel:QRCode.CorrectLevel.M }); el.title=''; return; } catch(e){} }
    el.innerHTML = `<div class="qr-fallback num" style="width:${size}px">${esc(text)}</div>`;
  });
}
let toastT;
function toast(msg, bad){ UI.toast={ msg, bad }; clearTimeout(toastT); toastT=setTimeout(()=>{ UI.toast=null; const t=document.querySelector('.toast'); if(t) t.remove(); }, bad?5200:3000); }
function go(mode){ UI.mode=mode; try{ history.replaceState(null,'','#'+mode); }catch(e){ location.hash=mode; } }

const A = {
  mode(d){ go(d.v); UI.confirm=null; render(); window.scrollTo(0,0); },

  openCust(d){ UI.section='customers'; UI.detail=d.id; UI.confirm=null; UI.adjustOpen=false; render(); window.scrollTo(0,0); },
  closeDetail(){ UI.detail=null; render(); },
  stamp(d, el){
    el.disabled = true;
    const idem = 'stamp:'+d.id+':'+(el.dataset.k || (el.dataset.k = token(10)));
    const r = addStamp(d.id, UI.actor, { idem });
    if (!r.ok) { toast(r.error, true); render(); return; }
    const c = cust(d.id);
    UI.anim = { cust:c.id, idx: r.reward && S.program.newCyclePolicy==='immediate' ? r.tx.after-1 : r.tx.after-1 };
    toast(r.reward ? `اكتملت الأختام! استحق العميل: ${r.reward.title}` : `أُضيف الختم (${r.tx.after} من ${r.tx.req}) وتحدّثت البطاقة`);
    render();
  },
  adjToggle(){ UI.adjustOpen=!UI.adjustOpen; render(); },
  ask(d){ UI.confirm=d.v; render(); },
  cancelConfirm(){ UI.confirm=null; render(); },
  redeem(d, el){ el.disabled=true; const r = redeem(d.id, UI.actor, { idem:'redeem:'+d.id+':'+UI.actor }); UI.confirm=null;
    if (!r.ok) toast(r.error, true); else toast(`تم اعتماد تسليم «${r.reward.title}»`); render(); },
  rtab(d){ UI.rewardsTab=d.v; UI.confirm=null; render(); },
  txf(d){ UI.txFilter=d.v; render(); },
  stab(d){ UI.settingsTab=d.v; UI.confirm=null; render(); },
  setActive(d){ const r=setProgramActive(d.v==='1', UI.actor); if(!r.ok) toast(r.error,true); else toast(d.v==='1'?'أُعيد تفعيل البرنامج':'أُوقف البرنامج مؤقتاً'); render(); },
  step(d){ readDraft(); const dr=draft(); dr.stampsRequired=Math.min(MAX_STAMPS, Math.max(1,(parseInt(dr.stampsRequired,10)||1)+(+d.v))); render(); },
  preset(d){ readDraft(); const dr=draft(); dr.rewardType=d.v; const p=REWARD_PRESETS.find(x=>x.key===d.v); if (p.title) dr.rewardTitle=p.title; else if (REWARD_PRESETS.some(x=>x.title===dr.rewardTitle)) dr.rewardTitle=''; render(); if(!p.title) document.getElementById('pTitle')?.focus(); },
  draftReset(){ UI.draft=null; render(); },
  parseMaps(){ const v=document.getElementById('sMaps').value; const m = v.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || v.match(/[?&](?:q|query|ll)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/) || v.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
    if (!m) { toast('لم أجد إحداثيات في الرابط. افتح موقع المحل في خرائط Google وانسخ الرابط من شريط العنوان، أو اكتب الإحداثيات يدوياً.', true); render(); return; }
    document.getElementById('sLat').value=m[1]; document.getElementById('sLng').value=m[2]; toast('استُخرجت الإحداثيات. اضغط «حفظ بيانات المحل» لاعتمادها.'); renderToastOnly(); },
  toggleEmp(d){ const e=emp(d.id); e.active=!e.active; audit(UI.actor, e.active?'تفعيل موظف':'إيقاف موظف','staff',e.name); toast(e.active?`فُعّل حساب ${e.name}`:`أُوقف حساب ${e.name}`); render(); },

};
function renderToastOnly(){ const old=document.querySelector('.toast'); if(old) old.remove(); if(!UI.toast) return; const t=document.createElement('div'); t.className='toast'+(UI.toast.bad?' bad':''); t.setAttribute('role','status'); t.textContent=UI.toast.msg; document.body.appendChild(t); }
function readDraft(){
  const dr=draft(); const g=id=>document.getElementById(id);
  if (!g('pN')) return dr;
  dr.stampsRequired=toLatin(g('pN').value); dr.rewardTitle=g('pTitle').value; dr.terms=g('pTerms').value;
  dr.stampExpiryDays=toLatin(g('pSE').value); dr.rewardExpiryDays=toLatin(g('pRE').value); dr.cooldownSec=toLatin(g('pCD').value);
  dr.newCyclePolicy=(document.querySelector('input[name=ncp]:checked')||{}).value||'immediate';
  const cr=document.querySelector('input[name=carry]:checked'); if (cr) dr.carry=cr.value;
  return dr;
}
function refreshProgPreview(){
  const dr=readDraft(); const pv=document.getElementById('progPreview'); if(pv) pv.innerHTML=previewCust();
  const n=parseInt(dr.stampsRequired,10)||0; const core = n!==S.program.stampsRequired || String(dr.rewardTitle).trim()!==S.program.rewardTitle;
  const cb=document.getElementById('carryBox'); if(cb) cb.hidden=!core;
  const rb=document.getElementById('resetBox'); if(rb) rb.hidden=dr.carry!=='reset';
  const pl=document.getElementById('pLine'); if(pl) pl.textContent=programLine({...S.program, stampsRequired:Math.max(1,Math.min(MAX_STAMPS,n||1)), rewardType:dr.rewardType, rewardTitle:dr.rewardTitle});
}

app.addEventListener('submit', e=>{
  e.preventDefault(); const f=e.target;
  if (f.id==='joinForm') {
    const btn=f.querySelector('button'); btn.disabled=true;
    const r=register(document.getElementById('phone').value);
    if (!r.ok) { document.getElementById('joinErr').textContent=r.error; btn.disabled=false; return; }
    UI.custId=r.customer.id; UI.justJoined=r.existing?'old':'new'; UI.walletInfo=null; render(); window.scrollTo(0,0);
  }
  if (f.id==='stampFind') { const c=resolveScan(UI.stampQ); UI.scanMsg=null; if(!c){ UI.stampFound=null; UI.scanMsg='لم يُعثر على بطاقة بهذه البيانات.'; } else UI.stampFound=c.id; render(); }
  if (f.id==='adjForm') { const r=adjust(UI.detail, UI.actor, document.getElementById('adjDelta').value, document.getElementById('adjReason').value, { idem:'adj:'+token(8) });
    if (!r.ok) { document.getElementById('adjErr').textContent=r.error; return; } UI.adjustOpen=false; toast(r.reward?`صُحّح الرصيد واكتملت الدورة: ${r.reward.title}`:`صُحّح الرصيد إلى ${r.tx.after}`); render(); }
  if (f.id==='progForm') { const dr=readDraft(); const r=updateProgram(dr, dr.carry, UI.actor, (document.getElementById('pConfirm')||{}).value);
    if (!r.ok) { document.getElementById('progErr').textContent=r.error; return; }
    UI.draft=null; toast(r.core ? `حُفظ البرنامج: ${programLine(S.program)}${r.affected?` · تأثر ${r.affected} عميل`:''}${r.completed?` · ${r.completed} استحقوا المكافأة`:''}` : 'حُفظت الإعدادات'); render(); }
  if (f.id==='shopForm') { const g=id=>document.getElementById(id).value.trim(); const lat=parseFloat(toLatin(g('sLat'))), lng=parseFloat(toLatin(g('sLng')));
    if (!g('sName')) { document.getElementById('shopErr').textContent='اكتب اسم المحل'; return; }
    if (!(lat>=-90&&lat<=90&&lng>=-180&&lng<=180)) { document.getElementById('shopErr').textContent='الإحداثيات غير صحيحة'; return; }
    if (!/^https?:\/\//.test(g('sBase'))) { document.getElementById('shopErr').textContent='رابط النظام يجب أن يبدأ بـ https://'; return; }
    Object.assign(S.shop,{ name:g('sName'), phone:toLatin(g('sPhone')), whatsapp:toLatin(g('sWa')), address:g('sAddr'), city:g('sCity'), hours:document.getElementById('sHours').value.trim(), website:g('sWeb'), baseUrl:g('sBase'), mapsUrl:g('sMaps'), lat, lng });
    S.customers.forEach(c=>bumpWallet(c, Date.now())); audit(UI.actor,'تعديل بيانات المحل','shop',S.shop.name); toast('حُفظت بيانات المحل وستتحدث كل البطاقات'); render(); }
  if (f.id==='empForm') { const name=document.getElementById('eName').value.trim(), login=document.getElementById('eLogin').value.trim(), role=document.getElementById('eRole').value;
    if (name.length<2) { document.getElementById('empErr').textContent='اكتب اسم الموظف'; return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(login)) { document.getElementById('empErr').textContent='اكتب بريداً إلكترونياً صحيحاً'; return; }
    if (S.employees.some(x=>x.login.toLowerCase()===login.toLowerCase())) { document.getElementById('empErr').textContent='هذا البريد مستخدم لموظف آخر'; return; }
    S.employees.push({ id:uid('e'), name, login, role, active:true }); audit(UI.actor,'إضافة موظف','staff',`${name} (${ROLES[role].label})`); toast(`أُضيف ${name}`); render(); }
});
function scanImage(file){
  const fr=new FileReader();
  fr.onload=()=>{ const img=new Image(); img.onload=()=>{
    const cv=document.createElement('canvas'); const k=Math.min(1, 1200/Math.max(img.width,img.height)); cv.width=img.width*k; cv.height=img.height*k;
    const cx=cv.getContext('2d'); cx.drawImage(img,0,0,cv.width,cv.height);
    const data=cx.getImageData(0,0,cv.width,cv.height); const code = window.jsQR ? jsQR(data.data, cv.width, cv.height) : null;
    if (!code) { UI.scanMsg='لم يُقرأ رمز QR من الصورة. صوّر الرمز بوضوح ومن قرب.'; UI.stampFound=null; render(); return; }
    const c=resolveScan(code.data); UI.stampQ=code.data;
    if (!c) { UI.scanMsg='الرمز مقروء لكنه لا يخص أي بطاقة لدى المحل.'; UI.stampFound=null; } else { UI.scanMsg=null; UI.stampFound=c.id; toast(`تم التعرف على البطاقة ${c.cardNo}`); }
    render(); }; img.src=fr.result; };
  fr.readAsDataURL(file);
}
